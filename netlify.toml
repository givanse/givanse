# https://givan.se — Netlify site `givanse`. Production branch is `svelte`
# (SvelteKit migration). Do not set `stop_builds` (blocks Trigger deploy and
# build hooks). `skip_prs` is already true in the UI; keep it that way.
#
# FLAG: `allowed_branches` used to list leftover `broccoli-taco`. It is already
# `["svelte"]` via `netlify api updateSite`. Do not set it in the UI.
#
# Production ignore is a path safety net (fail open). Deploy Previews always
# skip. Build hooks ignore the ignore exit code and always build.

[build]
  command = "npm run build"
  publish = "build"
  # Path safety net if auto-prod remains. Exit 0 skips; fail open otherwise.
  # Not `exit 0` — that would always-skip real `src/` / `static/` changes.
  ignore = "bash ./scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

# Skip every Deploy Preview (~credits). Complements UI skip_prs = true.
[context.deploy-preview]
  ignore = "exit 0"

# Extra credit guard if a non-svelte branch is added to allowed_branches later.
[context.branch-deploy]
  ignore = "exit 0"

[[headers]]
  for = "/img/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'none'; img-src 'self' data: https://c.disquscdn.com https://referrer.disqus.com https://static.licdn.com https://abs.twimg.com https://pbs.twimg.com https://ton.twimg.com https://syndication.twitter.com; trusted-types default jSecure"

[[headers]]
  for = "/_app/**"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://givanse.disqus.com https://c.disquscdn.com https://platform.linkedin.com https://platform.twitter.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://c.disquscdn.com https://referrer.disqus.com https://static.licdn.com https://abs.twimg.com https://pbs.twimg.com https://ton.twimg.com https://syndication.twitter.com; font-src 'self'; frame-src https://disqus.com https://platform.twitter.com https://syndication.twitter.com; connect-src 'self' https://givanse.disqus.com https://links.services.disqus.com https://www.linkedin.com https://syndication.twitter.com; trusted-types default jSecure"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://givanse.disqus.com https://c.disquscdn.com https://platform.linkedin.com https://platform.twitter.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://c.disquscdn.com https://referrer.disqus.com https://static.licdn.com https://abs.twimg.com https://pbs.twimg.com https://ton.twimg.com https://syndication.twitter.com; font-src 'self'; frame-src https://disqus.com https://platform.twitter.com https://syndication.twitter.com; connect-src 'self' https://givanse.disqus.com https://links.services.disqus.com https://www.linkedin.com https://syndication.twitter.com; trusted-types default jSecure"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"
    Cross-Origin-Opener-Policy = "same-origin"
